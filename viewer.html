<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Quiz Viewer</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #appWrapper { width: 100%; height: 100%; overflow: hidden; }
    #webFrame { display: block; width: 100%; height: 100%; border: 0; background: #000; }
  </style>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" defer></script>
</head>
<body>
<div id="appWrapper">
  <iframe id="webFrame" title="QuizButton room A81K54" src="https://quizbutton.app/room/A81K54"
          allow="autoplay; encrypted-media; fullscreen; picture-in-picture; clipboard-write; accelerometer; gyroscope; web-share"
          allowfullscreen
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation allow-presentation allow-downloads allow-modals"></iframe>
</div>
<script>
  // Office initialization must never navigate or recreate the QuizButton frame.
  // No reload timers, resume handlers, settings restoration, or frame replacement.
  window.addEventListener('DOMContentLoaded', function () {
    if (typeof Office !== 'undefined' && typeof Office.onReady === 'function') {
      Office.onReady(function () {
        // QuizButton already loads from the iframe's static src attribute.
      });
    }
  }, { once: true });
</script>
</body>
</html>
